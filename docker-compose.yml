---
# Default compose file for development and production.
# Should be used directly in development.
# Automatically loads `docker-compose.override.yml` if it exists.
# No extra steps required.
# Should be used together with `docker/docker-compose.prod.yml`
# in production.

services:
  web:
    <<: &web # Image name is changed in production:
      image: "peddlespark-backend:dev"
      build:
        target: development_build
        context: .
        dockerfile: ./docker/django/Dockerfile
        args:
          DJANGO_ENV: development
        cache_from:
          - "peddlespark-backend:dev"
          - "peddlespark-backend:latest"
          - "*"

      volumes:
        - django-static:/var/www/peddlespark/django/static
        - django-logs:/var/log/django
      networks:
        - app-net
      env_file: ./config/.env
      environment:
        # Update to point to host machine instead of container
        DJANGO_DATABASE_HOST: host.docker.internal
      # Add extra host mapping for Linux compatibility (optional but recommended)
      extra_hosts:
        - "host.docker.internal:host-gateway"

    command: python -We -bb manage.py runserver 0.0.0.0:8000
    healthcheck:
      test: /bin/sh /code/docker/django/healthcheck.sh
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:6
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  celeryworker:
    <<: *web
    image: peddlespark-backend-celeryworker:dev
    command: /start-celeryworker
    env_file: ./config/.env
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DJANGO_DATABASE_HOST: host.docker.internal
    # Add extra host mapping for Linux compatibility
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celerybeat:
    <<: *web
    image: peddlespark-backend-celerybeat:dev
    command: /start-celerybeat
    env_file: ./config/.env
    networks:
      - app-net
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DJANGO_DATABASE_HOST: host.docker.internal
    # Add extra host mapping for Linux compatibility
    extra_hosts:
      - "host.docker.internal:host-gateway"

  flower:
    <<: *web
    image: peddlespark-backend-flower:dev
    command: /start-flower
    env_file: ./config/.env
    networks:
      - app-net
      - proxy-net
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DJANGO_DATABASE_HOST: host.docker.internal
    # Add extra host mapping for Linux compatibility
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5555:5555" # Expose Flower port directly

networks:
  # Main application network for all internal services
  app-net:
  # Optional network for external access if needed
  proxy-net:

volumes:
  django-static:
  django-logs:
