upstream backend_server {
  server web:8000;
}

upstream flower_server {
  server flower:5555;
}

server {
    listen 80;
    server_name _;

    # Django static files
    location /static/ {
        alias /var/www/affleego/django/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Django media files
    location /media/ {
        alias /var/www/affleego/django/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Flower dashboard - now accessing the proper URL with the flower prefix
    location ~ ^/flower(/.*)?$ {
        proxy_pass http://flower_server/flower$1$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # Send all other requests to Django
    location / {
      proxy_pass http://backend_server;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;  # Force HTTPS here
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Server $http_host;
      proxy_redirect off;
    }
}
